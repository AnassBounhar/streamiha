<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oops - Page Not Found</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b1220;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 96vw);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.78);
      padding: 24px;
      box-shadow: 0 18px 44px rgba(2, 6, 23, 0.46);
      text-align: center;
    }
    .title {
      margin: 0 0 12px 0;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      color: #bfdbfe;
    }
    .text {
      margin: 0;
      line-height: 1.6;
      color: #cbd5e1;
      font-size: clamp(14px, 2vw, 18px);
    }
    .counter {
      margin-top: 18px;
      color: #93c5fd;
      font-weight: 700;
      font-size: 16px;
    }
    .home {
      margin-top: 16px;
      display: inline-block;
      border: 1px solid #2563eb;
      background: #1d4ed8;
      color: #fff;
      border-radius: 10px;
      padding: 10px 16px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">Oops, page not found</h1>
    <p class="text">Not Found<br />The requested URL was not found on this server.</p>
    <p class="text">Additionally, a 404 Not Found error was encountered while trying to use an ErrorDocument to handle the request.</p>
    <div class="counter">Returning home in <span id="count">5</span> seconds...</div>
    <a class="home" href="/index.html">Return Home Now</a>
  </main>
  <script>
    (function () {
      var remaining = 5;
      var el = document.getElementById('count');
      var timer = setInterval(function () {
        remaining -= 1;
        if (el) {
          el.textContent = String(remaining);
        }
        if (remaining <= 0) {
          clearInterval(timer);
          window.location.replace('/index.html');
        }
      }, 1000);
    })();
  </script>
</body>
</html>
